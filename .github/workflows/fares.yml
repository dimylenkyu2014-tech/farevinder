name: Fare Finder

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal / digest / test"
        default: normal

permissions:
  contents: write

concurrency:
  group: fare-finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check fares
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            digest) python -m bot.main --digest ;;
            test)   python -m bot.main --test ;;
            *)      python -m bot.main ;;
          esac
      - name: Save state
        run: |
          git config user.name "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add state/fares.json
          git diff --cached --quiet || git commit -m "update fares $(date -u +%F_%H%M)"
          git push
