name: Fare Query

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      q:
        description: "Запрос, напр. 14.01-17.01 или пт-вс январь"
        required: false

concurrency:
  group: fare-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read Telegram messages
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          Q: ${{ github.event.inputs.q }}
        run: |
          if [ -n "$Q" ]; then
            python3 -c "import json,os;json.dump([os.environ['Q']],open('queries.json','w'),ensure_ascii=False)"
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            python3 -m bot.poll queries.json
          fi
      - uses: actions/setup-python@v5
        if: steps.poll.outputs.has == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.poll.outputs.has == 'true'
        run: pip install -r requirements.txt
      - name: Search
        if: steps.poll.outputs.has == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.query queries.json
