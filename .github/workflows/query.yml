name: Fare Query

# Каждые 5 минут читает сообщения боту; на запрос вида «14.01-17.01» ищет в 8 параллельных задачах.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      q:
        description: "Запрос, напр. 14.01-17.01 или пт-вс январь"
        required: false

concurrency:
  group: fare-query
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.poll.outputs.has }}
      queries: ${{ steps.poll.outputs.queries }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Telegram messages
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          Q: ${{ github.event.inputs.q }}
        run: |
          if [ -n "$Q" ]; then
            python3 -c "import json,os;print('has=true');print('queries='+json.dumps([os.environ['Q']]))" >> "$GITHUB_OUTPUT"
          else
            python3 -m bot.poll queries.json
          fi

  collect:
    needs: poll
    if: needs.poll.outputs.has == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        origin: [VAR, SOF, OTP, BOJ]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          QUERIES: ${{ needs.poll.outputs.queries }}
        run: python -m bot.collect query --origin ${{ matrix.origin }} --shard ${{ matrix.shard }} --shards 2 --out part.json
      - uses: actions/upload-artifact@v4
        with:
          name: q-${{ matrix.origin }}-${{ matrix.shard }}
          path: part.json
          retention-days: 1

  answer:
    needs: [poll, collect]
    if: always() && needs.poll.outputs.has == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: q-*
          path: parts
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUERIES: ${{ needs.poll.outputs.queries }}
        run: python -m bot.query --parts parts
