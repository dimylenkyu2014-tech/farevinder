# ===== Fare Finder: настройки =====
# Меняешь этот файл в GitHub -> бот подхватит при следующем запуске.

origins:            # аэропорты вылета (IATA)
  - VAR             # Варна
  - SOF             # София
  - OTP             # Бухарест (Отопени)
  - BOJ             # Бургас

airlines:
  ryanair: true
  wizzair: true

horizon_days: 180        # насколько вперёд смотреть (от завтра)
currency: EUR            # все цены приводятся к этой валюте

# Wizz Air: показывать цены для членов Wizz Discount Club
wizz_discount_club: false

# --- Туда-обратно ---
round_trip:
  enabled: true
  min_nights: 2          # минимум ночей на месте
  max_nights: 10         # максимум ночей
  return_to_any_origin: true  # Wizz: можно вернуться в любой из 4 городов (напр. туда из Софии, обратно в Варну)

# --- Когда слать алерты ---
alerts:
  one_way:               # в одну сторону
    enabled: true        # false = алерты только по туда-обратно (в сводке one-way останется)
    max_price: 30        # «дёшево»: дешевле 30 EUR -> алерт
    new_route_max_price: 45   # новое направление/месяц дешевле 45 EUR
  round_trip:            # туда + обратно, сумма
    max_price: 60
    new_route_max_price: 80
  drop_pct: 20           # цена упала минимум на 20% от прошлой проверки...
  drop_abs: 8            # ...и минимум на 8 EUR (чтобы не спамить из-за копеек)
  realert_after_hours: 72  # не повторять алерт по той же цене раньше чем через N часов

# Ежедневная сводка ТОП дешёвых направлений (час по UTC, когда она отправляется).
# Запуск в workflow в 6 и 18 UTC, так что ставь одно из этих значений. 6 UTC = 8:00 по Варне зимой (9:00 летом).
digest:
  enabled: true
  hour_utc: 6
  top_n: 10             # по 10 в каждом разделе (туда-обратно / в одну сторону)

# Фильтры направлений (IATA). Пусто = все.
only_destinations: []
exclude_destinations: []

# Пауза между запросами к Wizz (сек) — меньше = быстрее, но выше риск бана
wizz_request_delay: 1.2
